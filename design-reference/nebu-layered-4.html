.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(9,6,15,.55) 100%),
  linear-gradient(180deg,rgba(9,6,15,.55) 0%,transparent 22%,transparent 62%,rgba(9,6,15,.75) 100%)}

/* LAYER 2 coins, between plate and king */
.coins{position:absolute;inset:0;z-index:2;pointer-events:none;will-change:transform;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.coin{position:absolute;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffe9a8,#d9a93a 60%,#8a5f16);
  box-shadow:0 0 12px rgba(226,180,86,.45);animation:fall linear infinite;opacity:.9}
@keyframes fall{0%{transform:translateY(-12vh) rotate(0) scale(1)}100%{transform:translateY(112vh) rotate(520deg) scale(.85)}}

/* LAYER 3 the king, his own element */
.stage{position:absolute;z-index:3;bottom:0;left:50%;transform:translateX(-50%);
  height:92vh;aspect-ratio:560/728;will-change:transform;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.stage img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
.hit{position:absolute;left:14%;top:4%;width:72%;height:80%;background:none;border:0;cursor:pointer}

/* ANCHORED TO HIM, not to the screen */
.thought{position:absolute;left:98%;top:3%;width:min(30vw,400px);text-align:left;z-index:6;
  transform:rotate(-2.5deg);background:none;border:0;padding:0;color:inherit;cursor:pointer}
.thought strong{display:block;font:700 clamp(30px,3.4vw,56px)/.94 'Barlow Condensed',Impact,sans-serif;
  letter-spacing:-.4px;text-shadow:0 4px 30px #0d0a13,0 2px 4px #0d0a13}
.thought em{font-style:normal;color:var(--acid)}
.thought small{display:block;font:600 22px 'Caveat',Georgia,serif;color:var(--gold);margin-top:12px;
  text-shadow:0 2px 14px #0d0a13}
.thought .anim{display:block;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.rec{position:absolute;right:97%;bottom:9%;width:min(15vw,190px);z-index:6;text-align:center;
  background:none;border:0;padding:0;color:inherit;cursor:pointer;transform:rotate(-7deg);transition:transform .3s}
.rec:hover{transform:rotate(-3deg) translateY(-6px)}
.rec .sleeve{width:100%;aspect-ratio:1;border:1px solid #ab916966;background:#392d2d;overflow:hidden;
  box-shadow:0 20px 44px #000a;position:relative}
.rec .sleeve img{width:100%;height:100%;object-fit:cover;filter:sepia(.16)}
.rec .sleeve b{position:absolute;left:10px;right:10px;bottom:10px;
  font:700 20px/.95 'Barlow Condensed',Impact,sans-serif;letter-spacing:0;text-align:left}
.rec .vinyl{position:absolute;top:6%;right:-34%;width:88%;aspect-ratio:1;border-radius:50%;
  background:repeating-radial-gradient(circle,#16151c 0,#16151c 2px,#2c2931 3px,#17161d 4px);z-index:-1;
  box-shadow:4px 10px 22px #0008}
.rec.playing .vinyl{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rec span.note{display:block;font:600 20px 'Caveat',Georgia,serif;color:var(--gold);margin-top:12px}

/* pulse, his reaction, floats near him then goes */
.pulse{position:absolute;z-index:7;left:50%;bottom:11%;transform:translateX(-50%);
  width:min(440px,80vw);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.msg{background:rgba(10,7,17,.72);backdrop-filter:blur(6px);border-left:3px solid var(--acid);
  padding:9px 13px;font-size:14px;line-height:1.4;border-radius:3px;animation:in .4s ease both;
  box-shadow:0 12px 30px #0007;max-width:100%}
.msg.sell{border-left-color:#c8604a}
.msg i{display:block;font-style:normal;font:700 9px 'DM Sans';letter-spacing:1.6px;color:#a89dae;margin-bottom:4px}
.msg.out{opacity:0;transform:translateY(-6px);transition:opacity .7s,transform .7s}

/* the only furniture */
.mark{position:absolute;z-index:8;top:26px;left:30px;display:flex;gap:11px;align-items:center}
.mark img{width:44px;height:44px;border-radius:50%;border:1px solid #a98c5266;object-fit:cover}
.mark b{display:block;font:700 20px/.95 'Barlow Condensed',Impact,sans-serif;letter-spacing:1px}
.mark small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--gold);margin-top:6px}
.note{position:absolute;z-index:8;right:28px;bottom:24px;width:250px;padding:22px 20px 16px;
  background:#dcd0ad;color:#393128;transform:rotate(3.5deg);box-shadow:0 12px 34px #0008;
  clip-path:polygon(0 1%,17% 0,35% 1%,56% 0,82% 1%,100% 0,99% 100%,78% 99%,55% 100%,31% 99%,0 100%)}
.note em{display:block;font:700 8px 'DM Sans';font-style:normal;letter-spacing:1.6px;color:#756b56}
.note h1{font:700 30px/.94 'Barlow Condensed',Impact,sans-serif;margin:12px 0 8px}
.note p{font-size:12px;margin:0}
.note s{display:block;text-decoration:none;font:600 19px 'Caveat',Georgia,serif;color:#725039;
  transform:rotate(-6deg);text-align:right;margin:6px 0 10px}
.note .cta{border-top:1px dashed #9b8b6b;padding-top:10px;display:flex;gap:12px;align-items:center;font-size:9px;letter-spacing:.6px}
.note .cta b{font-size:14px;margin-right:auto;font-family:'Barlow Condensed'}
.tape{position:absolute;width:74px;height:16px;background:#c6b89999;top:-6px;left:84px;transform:rotate(-5deg)}

@media(max-width:1100px){
  .thought{left:auto;right:92%;top:2%;width:min(40vw,320px);text-align:right}
  .rec{right:auto;left:96%;bottom:6%;width:150px}
}
@media(max-width:760px){
  .stage{height:64vh;bottom:12vh}
  .thought{position:absolute;left:50%;right:auto;top:-30vh;transform:translateX(-50%) rotate(-2deg);
    width:86vw;text-align:center}
  .thought strong{font-size:34px}
  .thought small{font-size:19px;margin-top:8px}
  .rec{left:auto;right:auto;bottom:-11vh;transform:translateX(-50%) rotate(-7deg);left:24%;width:116px}
  .rec:hover{transform:translateX(-50%) rotate(-7deg)}
  .note{right:14px;bottom:14px;width:180px;padding:16px 14px 12px;transform:rotate(3deg)}
  .note h1{font-size:22px}.note p{font-size:11px}.note s{font-size:16px}
  .mark{top:16px;left:16px}.mark img{width:36px;height:36px}.mark b{font-size:16px}
  .pulse{bottom:auto;top:12px;width:88vw}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const thoughts=[
 ["i&rsquo;m not wrong.","i&rsquo;m early.","very fucking early."],
 ["my wealth","is resting.","do not disturb it."],
 ["take profits?","take what?","i have principles."],
 ["we just","got here.","it has been nine months."],
 ["the palace is","under renovation.","indefinitely."],
 ["time","is fud.","look it up."]
];
let t=0;
function nextT(){t=(t+1)%thoughts.length;
 const x=document.getElementById('thx');
 x.innerHTML='<strong>'+thoughts[t][0]+'<br><em>'+thoughts[t][1]+'</em></strong><small>'+thoughts[t][2]+'</small>';
 x.style.animation='none'; void x.offsetWidth; x.style.animation='';}
document.getElementById('th').onclick=nextT;
document.getElementById('hit').onclick=nextT;

const rec=document.getElementById('rec');
rec.onclick=()=>{rec.classList.toggle('playing');
 drop({k:'buy',who:'NOW PLAYING',t:'i made this. you&rsquo;re welcome.'});};

// coins between the plate and him
const cw=document.getElementById('coins');
for(let i=0;i<9;i++){const c=document.createElement('span');c.className='coin';
 c.style.left=(4+Math.random()*92)+'%';
 c.style.animationDuration=(6+Math.random()*7)+'s';
 c.style.animationDelay=(-Math.random()*10)+'s';
 c.style.transform='scale('+(.6+Math.random()*.7)+')';cw.appendChild(c);}

// pulse bank, real lines
const bank=[
 {k:'buy',who:'0.8 SOL IN',t:'good. you are early. i am not going to say it twice'},
 {k:'sell',who:'1.2 SOL OUT',t:'you sold. that is a timing problem, not a me problem'},
 {k:'buy',who:'0.2 SOL IN',t:'tiny. babylon was tiny once'},
 {k:'sell',who:'4.0 SOL OUT',t:'this is a normal consolidation. it is a seven year one'},
 {k:'buy',who:'2.6 SOL IN',t:'okay. okay okay okay'},
 {k:'sell',who:'0.5 SOL OUT',t:'weak hands. relationships included'},
 {k:'buy',who:'QUIET',t:'quiet. i like quiet. i am lying'},
 {k:'buy',who:'0.1 SOL IN',t:'that is groceries. i mean. that is nothing to me'}
];
const pbox=document.getElementById('pulse');
function drop(m){const el=document.createElement('div');el.className='msg '+m.k;
 el.innerHTML='<i>'+m.who+'</i>'+m.t;pbox.prepend(el);
 while(pbox.children.length>2)pbox.removeChild(pbox.lastChild);
 setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),800);},6800);}
let bi=0;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){setTimeout(()=>drop(bank[bi++]),2200);
 setInterval(()=>drop(bank[bi++%bank.length]),6000);
 setInterval(nextT,14000);}

// depth
const plate=document.getElementById('plate'),stage=document.getElementById('stage'),coins=cw;
if(!reduce){window.addEventListener('pointermove',e=>{
 const x=(e.clientX/window.innerWidth-.5),y=(e.clientY/window.innerHeight-.5);
 plate.style.transform='translate('+(x*-22)+'px,'+(y*-14)+'px) scale(1.03)';
 coins.style.transform='translate('+(x*-11)+'px,'+(y*-7)+'px)';
 stage.style.transform='translateX(-50%) translate('+(x*9)+'px,'+(y*5)+'px)';
});}
